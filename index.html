<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Học Tiếng Việt</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0077ff;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px;
      border: none;
      background: #0077ff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #005fd1;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>📘 Học Tiếng Việt Cơ Bản</h1>
  <p>Website luyện từ vựng đơn giản</p>
</header>

<div class="container">

  <div class="card">
    <h2>Bài 1: Xin chào</h2>
    <p>Tiếng Việt: Xin chào</p>
    <p>Nghĩa: Hello</p>
    <button onclick="show1()">Học câu này</button>
    <div class="result" id="r1"></div>
  </div>

  <div class="card">
    <h2>Bài 2: Cảm ơn</h2>
    <p>Tiếng Việt: Cảm ơn</p>
    <p>Nghĩa: Thank you</p>
    <button onclick="show2()">Học câu này</button>
    <div class="result" id="r2"></div>
  </div>

  <div class="card">
    <h2>Bài 3: Tôi là ai?</h2>
    <p>Tiếng Việt: Tôi là...</p>
    <p>Nghĩa: I am...</p>
    <button onclick="show3()">Học câu này</button>
    <div class="result" id="r3"></div>
  </div>

</div>

<script>
  function show1() {
    document.getElementById("r1").innerText = "✔ Xin chào = Hello";
  }

  function show2() {
    document.getElementById("r2").innerText = "✔ Cảm ơn = Thank you";
  }

  function show3() {
    document.getElementById("r3").innerText = "✔ Tôi là... = I am...";
  }
</script>

</body>
</html>
